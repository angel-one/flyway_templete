# environments/<env>/<env>.conf
# Environment: <ENV_NAME>   e.g. DEV / UAT / CUG / PQA / PROD

flyway.url=jdbc:postgresql://<database_conn_url>:5432/<db_name>

# Credentials are injected at runtime, not hardcoded here.
# Locally: export FLYWAY_USER / FLYWAY_PASSWORD before running the CLI.
# In CI: pulled from this environment's GitHub Actions secrets.
flyway.user=${FLYWAY_USER}
flyway.password=${FLYWAY_PASSWORD}

# Where migration scripts live, relative to repo root — this env's own folder only.
flyway.locations=filesystem:environments/pqa/sql

# Safety settings — keep these consistent across all environments so no
# environment-specific "shortcuts" creep in.
flyway.baselineOnMigrate=true
flyway.validateOnMigrate=true
flyway.outOfOrder=false
flyway.cleanDisabled=true